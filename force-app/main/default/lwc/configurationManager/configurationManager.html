<template>
    <a lwc:ref="cmdtLink" href="" target="_blank" rel="noopener noreferrer" style="display:none"></a>
    <lightning-layout pull-to-boundary="small">
        <lightning-layout-item size="12" large-device-size={selectorSize} padding="horizontal-small">
            <lightning-card title="Indicator Settings" icon-name="standard:all">
                <div slot="actions">
                    <lightning-button-menu alternative-text="Toggle menu" menu-alignment="auto" nubbin label="New">
                        <template for:each={newUrls} for:item="entity">
                            <lightning-menu-item
                                key={entity.Name}
                                label={entity.Label}
                                value={entity.NewUrl}
                                onclick={handleNewClick}
                            ></lightning-menu-item>
                        </template>
                    </lightning-button-menu>
                </div>
                <p class="slds-p-horizontal_small">Review existing Indicators or create new custom metadata records.<br/></p>
                <!-- <lightning-layout pull-to-boundary="small"> -->
                    <!-- <lightning-layout-item size="3" padding="around-small"> -->
                        <lightning-combobox
                            name="bundleSearch"
                            label="Indicator Bundle"
                            value={bundleName}
                            placeholder="Select a Bundle"
                            options={options}
                            onchange={handleChange}
                            class="slds-p-horizontal_small"
                        ></lightning-combobox>
                    <!-- </lightning-layout-item> -->
                <!-- </lightning-layout> -->
            </lightning-card>
        </lightning-layout-item>
    </lightning-layout>
    <template lwc:if={errorMessage}>
        <div
            class="slds-notify slds-notify_alert slds-theme_alert-texture slds-alert_error slds-m-top_small"
            role="alert"
        >
            <span class="slds-assistive-text">Alert</span>
            <span
                class="slds-icon_container slds-icon-utility-error slds-m-right_x-small"
                title="Error"
            >
                <lightning-icon
                    icon-name="utility:error"
                    alternative-text="error icon"
                    variant="inverse"
                    size="x-small"
                ></lightning-icon>
            </span>
            <h2>{errorMessage}</h2>
        </div>
    </template>
    <template lwc:if={showSpinner}>
        <lightning-spinner
            alternative-text="Loading"
            variant="brand"
            size="large"
        ></lightning-spinner>
    </template>
    <template lwc:elseif={showKey}>
        <lightning-layout pull-to-boundary="small">
            <lightning-layout-item size="12" padding="horizontal-small">
                <c-key
                    bundle={bundle}
                    is-setup="true"
                ></c-key>
            </lightning-layout-item>
        </lightning-layout>
    </template>

</template>

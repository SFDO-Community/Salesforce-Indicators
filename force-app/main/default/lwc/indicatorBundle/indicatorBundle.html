<template>
    <template if:true={bundleActive}>
        <template if:false={errorOccurred}>
            <!-- <lightning-card variant="narrow" icon-name={card.icon} title={card.title}> -->
            <article class="slds-card">
                <template lwc:if={isStandardUsage}>
                    <template lwc:if={showTitle}>
                        <div class="cardIcon">
                            <div class="slds-card__header slds-grid">
                                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                    <div class="slds-media__body">
                                        <h2 class="slds-card__header-title">
                                            <lightning-icon
                                                lwc:if={card.icon}
                                                icon-name={card.icon}
                                                size="small"
                                                class={card.iconClass}
                                            >
                                            </lightning-icon>
                                            <slot name="title">
                                                {card.title}
                                            </slot>
                                        </h2>
                                    </div>
                                </header>
                            </div>
                        </div>
                    </template>
                </template>
                <template lwc:else>
                    <div class="slds-card__body slds-card__body_inner">
                    <template lwc:if={showTitle}>
                        <div class="section-layout-container slds-section slds-is-open">
                            <h3 class="slds-section__title slds-theme_shade">
                                <span class="slds-section__title-action">
                                    <lightning-icon
                                        lwc:if={card.icon}
                                        icon-name={utilityCardIcon}
                                        size="x-small"
                                        class="slds-section__title-action-icon slds-button__icon_left slds-icon_container"
                                    ></lightning-icon>
                                    <span class="slds-truncate" title={card.title}>{card.title}</span>
                                </span>
                            </h3>
                        </div>
                    </template>
                    </div>
                </template>
                <div class={sectionBodyClass}>
                    <div class="slds-col slds-grid slds-grid_vertical">
                        <div class="slds-col">
                            <template lwc:if={showDescription}>
                                <p class="slds-var-p-left_medium slds-var-p-right_x-small slds-var-p-bottom_small">{card.body}</p>
                            </template>
                        </div>
                        <div class="slds-col">
                        <!-- TODO: Do we put this in a Layout which would be responsive to the container, this could allow for empty slots too -->
                        <div class="slds-var-m-left_medium indicator-items">
                            <template if:true={results}>
                                <template for:each={results} for:item="fld">
                                    <template lwc:if={showAvatarStyle}>
                                        <div key={fld.fName}
                                            if:true={fld.fShowAvatar}
                                            class={fld.fContainerClass}
                                            data-id={fld.fId}
                                            onmouseenter={handlePopoverEnter}
                                            onmouseleave={handlePopoverLeave}>
                                            <div class="ind-indicator-wrapper"
                                                data-id={fld.fId}
                                                onmouseenter={handlePopoverEnter}
                                                onmouseleave={handlePopoverLeave}>
                                                <c-indicator-bundle-item
                                                    ind-text={fld.fTextShown}
                                                    ind-size={indsSize}
                                                    ind-shape={indsShape}
                                                    ind-icon={fld.fIconName}
                                                    ind-image={fld.fImageURL}
                                                    ind-background-color={fld.fIconBackground}
                                                    ind-foreground-color={fld.fIconForeground}
                                                    ind-clickable={fld.fItemClass}
                                                    ind-show-action-badge={fld.fActionType}
                                                    ind-alt-text={fld.fFieldLabel}
                                                    ind-compact
                                                    data-id={fld.fId}
                                                    onclick={handleIndicatorClick}>
                                                </c-indicator-bundle-item>
                                            </div>
                                            <template lwc:if={fld.fShowPopover}>
                                                <section
                                                    class="slds-popover slds-popover_small slds-nubbin_top-left ind-popover"
                                                    role="dialog"
                                                    aria-label={fld.fFieldLabel}>
                                                    <!-- HEADER PLACEHOLDER: To add a visible popover title, insert slds-popover__header here -->
                                                    <template lwc:if={fld.fPopoverBody}>
                                                        <div class="slds-popover__body">
                                                            <p>{fld.fPopoverBody}</p>
                                                        </div>
                                                    </template>
                                                    <template lwc:if={fld.fActionType}>
                                                        <footer class="slds-popover__footer">
                                                            <button
                                                                class="slds-button slds-button_neutral"
                                                                data-id={fld.fId}
                                                                onclick={handlePopoverAction}>
                                                                {fld.fResolvedActionButtonLabel}
                                                            </button>
                                                            <template lwc:if={fld.fActionHelpText}>
                                                                <lightning-helptext
                                                                    content={fld.fActionHelpText}>
                                                                </lightning-helptext>
                                                            </template>
                                                        </footer>
                                                    </template>
                                                </section>
                                            </template>
                                        </div>
                                    </template>
                                    <template lwc:if={showPillStyle}>
                                        <div key={fld.fName}
                                            if:true={fld.fShowAvatar}
                                            class={fld.fContainerClass}
                                            data-id={fld.fId}
                                            onmouseenter={handlePopoverEnter}
                                            onmouseleave={handlePopoverLeave}>
                                            <div class="ind-indicator-wrapper"
                                                data-id={fld.fId}
                                                onmouseenter={handlePopoverEnter}
                                                onmouseleave={handlePopoverLeave}>
                                                <c-indicator-bundle-pill
                                                    ind-text={fld.fTextShown}
                                                    ind-icon={fld.fIconName}
                                                    ind-image={fld.fImageURL}
                                                    ind-badge-pill-text={fld.fBadgePillText}
                                                    ind-alt-text={fld.fFieldLabel}
                                                    ind-background-color={fld.fIconBackground}
                                                    ind-foreground-color={fld.fIconForeground}
                                                    ind-text-color={fld.fTextColor}
                                                    inds-size="x-small"
                                                    inds-shape={indsShape}
                                                    ind-clickable={fld.fItemClass}
                                                    ind-is-touch={isTouchDevice}
                                                    data-id={fld.fId}
                                                    onclick={handleIndicatorClick}>
                                                </c-indicator-bundle-pill>
                                            </div>
                                            <template lwc:if={fld.fShowPopover}>
                                                <section
                                                    class="slds-popover slds-popover_small slds-nubbin_top-left ind-popover"
                                                    role="dialog"
                                                    aria-label={fld.fFieldLabel}>
                                                    <!-- HEADER PLACEHOLDER: To add a visible popover title, insert slds-popover__header here -->
                                                    <template lwc:if={fld.fPopoverBody}>
                                                        <div class="slds-popover__body">
                                                            <p>{fld.fPopoverBody}</p>
                                                        </div>
                                                    </template>
                                                    <template lwc:if={fld.fActionType}>
                                                        <footer class="slds-popover__footer">
                                                            <button
                                                                class="slds-button slds-button_neutral"
                                                                data-id={fld.fId}
                                                                onclick={handlePopoverAction}>
                                                                {fld.fResolvedActionButtonLabel}
                                                            </button>
                                                            <template lwc:if={fld.fActionHelpText}>
                                                                <lightning-helptext
                                                                    content={fld.fActionHelpText}>
                                                                </lightning-helptext>
                                                            </template>
                                                        </footer>
                                                    </template>
                                                </section>
                                            </template>
                                        </div>
                                    </template>
                                    <template lwc:if={showBadgeStyle}>
                                        <div key={fld.fName}
                                            if:true={fld.fShowAvatar}
                                            class={fld.fContainerClass}
                                            data-id={fld.fId}
                                            onmouseenter={handlePopoverEnter}
                                            onmouseleave={handlePopoverLeave}>
                                            <div class="ind-indicator-wrapper"
                                                data-id={fld.fId}
                                                onmouseenter={handlePopoverEnter}
                                                onmouseleave={handlePopoverLeave}>
                                                <c-indicator-bundle-badge
                                                    ind-text={fld.fBadgePillText}
                                                    ind-icon={fld.fIconName}
                                                    ind-icon-position={fld.fIconPosition}
                                                    ind-background-color={fld.fIconBackground}
                                                    ind-foreground-color={fld.fIconForeground}
                                                    ind-text-color={fld.fTextColor}
                                                    ind-alt-text={fld.fFieldLabel}
                                                    ind-clickable={fld.fItemClass}
                                                    data-id={fld.fId}
                                                    onclick={handleIndicatorClick}>
                                                </c-indicator-bundle-badge>
                                            </div>
                                            <template lwc:if={fld.fShowPopover}>
                                                <section
                                                    class="slds-popover slds-popover_small slds-nubbin_top-left ind-popover"
                                                    role="dialog"
                                                    aria-label={fld.fFieldLabel}>
                                                    <!-- HEADER PLACEHOLDER: To add a visible popover title, insert slds-popover__header here -->
                                                    <template lwc:if={fld.fPopoverBody}>
                                                        <div class="slds-popover__body">
                                                            <p>{fld.fPopoverBody}</p>
                                                        </div>
                                                    </template>
                                                    <template lwc:if={fld.fActionType}>
                                                        <footer class="slds-popover__footer">
                                                            <button
                                                                class="slds-button slds-button_neutral"
                                                                data-id={fld.fId}
                                                                onclick={handlePopoverAction}>
                                                                {fld.fResolvedActionButtonLabel}
                                                            </button>
                                                            <template lwc:if={fld.fActionHelpText}>
                                                                <lightning-helptext
                                                                    content={fld.fActionHelpText}>
                                                                </lightning-helptext>
                                                            </template>
                                                        </footer>
                                                    </template>
                                                </section>
                                            </template>
                                        </div>
                                    </template>
                                </template>
                            </template>
                        </div>
                    </div>
                    </div>
                    <div class="slds-var-p-right_medium slds-var-p-bottom_x-small" >
                        <div class="slds-button-group" role="group">
                            <lightning-button-icon
                                variant="base"
                                icon-name="utility:info_alt"
                                alternative-text="Indicator Value Key"
                                class="slds-var-m-left_xx-small"
                                title="Indicator Value Key"
                                slot="actions"
                                onclick={handleInfoKeyClick}
                                aria-haspopup="dialog"
                            ></lightning-button-icon>
                            <template if:true={showRefresh}>
                                <lightning-button-icon
                                    variant="base"
                                    icon-name="utility:refresh"
                                    alternative-text="Refresh"
                                    class="slds-var-m-left_xx-small"
                                    title="Refresh"
                                    slot="actions"
                                    onclick={refreshCmdt}
                                ></lightning-button-icon>
                            </template>
                        </div>
                    </div>
                </div>
                <!-- <template if:true={results}>

                </template> -->
                <template lwc:if={displayFooter}>
                    <footer class="slds-card__footer">
                        <lightning-badge label={mappedField}></lightning-badge>
                        <lightning-helptext content={targetMessage}></lightning-helptext>
                    </footer>
                </template>
            </article>
        </template>
    </template>
    <template if:true={errorOccurred}>
        <template lwc:if={isManageEnabled}>
            <lightning-card variant="base" title="Error" icon-name="utility:error">
                <div class="slds-card__body slds-card__body_inner">
                    {errorMessage}
                    <template if:true={showIllustration}>
                        <c-illustration
                            heading =  {illustration.heading}
                            message-body = {illustration.messageBody}
                            image-name = {illustration.imageName}
                            image-size = {flexipageRegionWidth}
                            class="slds-illustration slds-illustration_small"
                        ></c-illustration>
                    </template>
                </div>
            </lightning-card>
        </template>
    </template>
</template>

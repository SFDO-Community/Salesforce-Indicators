<template>
    <lightning-modal-header label={bundleTitle}></lightning-modal-header>
    <lightning-modal-body>
        <c-key
            bundle-name={bundleName}
            bundle={bundle}
        ></c-key>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-layout>
            <lightning-layout-item size="6" class="slds-text-align_left">
                <lightning-button-stateful
                    label-when-off="Collapse All"
                    label-when-on="Expand All"
                    icon-name-when-off="utility:collapse_all"
                    icon-name-when-on="utility:expand_all"
                    variant="brand"
                    selected={isOpen}
                    onclick={handleState2}>
                </lightning-button-stateful>
            </lightning-layout-item>
            <lightning-layout-item size="6" class="slds-text-align_right">
                <lightning-button label="Close" onclick={handleOkay} class="slds-m-left_medium"></lightning-button>
            </lightning-layout-item>
        </lightning-layout>
    </lightning-modal-footer>
</template>

name: Recover packaging auth URL

on:
  push:
    branches: [main-test-only]
    paths:
      - .github/workflows/recover-packaging-auth.yml
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/recover-packaging-auth.yml
  workflow_dispatch:

permissions: {}

jobs:
  recover:
    if: >-
      github.repository == 'SFDO-Community/Salesforce-Indicators' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: packaging-prod
    steps:
      - name: Encrypt packaging auth URL
        shell: bash
        env:
          PACKAGING_ORG_AUTH_URL: ${{ secrets.PACKAGING_ORG_AUTH_URL }}
          RECOVERY_CERT_PEM: |
            -----BEGIN CERTIFICATE-----
            MIIFIDCCAwigAwIBAgIUZS7s/XwvmoJbW2egixKI0NoVBoswDQYJKoZIhvcNAQEL
            BQAwMDEuMCwGA1UEAwwlU2FsZXNmb3JjZSBJbmRpY2F0b3JzIHNlY3JldCByZWNv
            dmVyeTAeFw0yNjExMjQxOTE2NDVaFw0yNzExMjQxOTE2NDVaMDAxLjAsBgNVBAMM
            JVNhbGVzZm9yY2UgSW5kaWNhdG9ycyBzZWNyZXQgcmVjb3ZlcnkwggIiMA0GCSqG
            SIb3DQEBAQUAA4ICDwAwggIKAoICAQCi+AcSGRQHIUEBe0w3auOUdhutlTJylIAH
            llMRhWaM0QLf7nQNwAfAF/oRR332IC3JmHI7WE4c2cF6bBsj0PCnl6yUxHtWlnvu
            reBVi9RiqJHiw+uI66BVkvrSkTyNawro31KRIgrvhCfyBTwxhcWhoUHKIeDbwRPZ
            FE5cs6yqzqal2VmBFWZnL2s0Uf+XxNIMjOUxl09nxDtohtJIHVTqeQbQSiSoVMB/
            YimKXZ0khrCHcQHKtGBa6KR+5pox34lmCYKBOhk5hNCPbrexWE5K6pZMrP6HZCAi
            /CoSaRc9+gJBDhBJZEDaW2FcAKv2OLUHsMcUVQ12os2gUEOS9Jy8pQYHDMw6chUf
            ubMCmRLPegryQmB2cW64pxcvUmNkttXolh4KU9XVyF2DQflNQ0Cqu5Q52ivv3zW6
            BETh1ekxeMBMNtcqXZOBvHJyVMXB7xHrTKhk2eEMiCGiJLgsFS4HV5QReZgVfQpJ
            Z8Bn7F0joZ9HBEtG9CZywwa7j77MVbzLxbB8t870vgD9gMPE0HpPIGhEFkQ8rwVY
            dgfZ2oDzt6oW+pd/M5/qNt8rXyuGh9bKymDe3GR++/xJ7WZkZ4HspkWWI+/btM7p
            kZi7c3DFJAS9rpjtG6ei3r21dzWlzb8XbB/HGBPxIwxHwXV/mdt3BYc1DGjsTk41
            XfpByqL7ewIDAQABozIwMDAdBgNVHQ4EFgQUdnUeQx1cwMGLzR6NAlNAxzktJS0w

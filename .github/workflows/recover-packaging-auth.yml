            pKN4z2TMKcFfSAQMDmCyxr/hmVczkmabjFEkx+dbo/1eQ+jJgCGIE9txPCQvxeIN
            06hFrL8Nd220T6oQXZ5BWHck9Hu/nixIfBxDl+dy5Nj/sbrpZ/wTmLaKnIDFY/84
            VWFrGfsBj6zDJYB3tUbYDgPgOr+Y3fFVFEYROD7WOJjRQ2P5bq6Oimu3bTMadZJn
            roMc3nkih6aSAGWXaa9eovQOJ3ZjSpeITkYiyCMyPCAbuKWgakmmb5eXYQOaMrg8
            YI3n531QAxwONCwQDuKfzVqV6Dk=
            -----END CERTIFICATE-----
        run: |
          set +x
          set -euo pipefail
          umask 077

          if [[ -z "$PACKAGING_ORG_AUTH_URL" ]]; then
            echo "::error::PACKAGING_ORG_AUTH_URL is empty or unavailable. Check the environment secret name."
            exit 1
          fi

          cert_file="$(mktemp "$RUNNER_TEMP/packaging-recipient.XXXXXX")"
          trap 'rm -f "$cert_file"' EXIT
          printf '%s\n' "$RECOVERY_CERT_PEM" > "$cert_file"

          printf '%s' "$PACKAGING_ORG_AUTH_URL" | openssl cms \
            -encrypt -binary -aes-256-gcm -outform DER \
            -recip "$cert_file" \
            -keyopt rsa_padding_mode:oaep \
            -keyopt rsa_oaep_md:sha256 \
            -keyopt rsa_mgf1_md:sha256 \
            -out "$RUNNER_TEMP/PACKAGING_ORG_AUTH_URL.cms"

      - name: Upload encrypted auth URL
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packaging-auth-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/PACKAGING_ORG_AUTH_URL.cms
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary encrypted file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/PACKAGING_ORG_AUTH_URL.cms"

area: merge-field-tokens
area_title: "Merge-field tokens (SML syntax)"
area_risk: low
area_summary: >
  Action Target, Hover Text, and the bundle's Card Text (description) now resolve
  {!Field_API_Name} tokens against the wired record, refreshing whenever the
  record data changes.
area_setup: >
  Ready-made example: the sample config ships an Account Ticker indicator on
  Account with Action Target https://finance.yahoo.com/quote/{!TickerSymbol} —
  use it directly after `cci flow run config_demo`, provided the demo Account has
  a TickerSymbol value.
paths:
  - force-app/main/default/lwc/indicatorBundle
  - force-app/main/default/lwc/indicatorBundleItem

scenarios:
  - slug: merge-token-action-target-navigation
    added: 2026-08-10
    added_reason: "original sprint regression plan (feature/staging-claude vs main)"
    added_ref: null
    status: active
    superseded_by: null
    risk: low
    automation: functional-only
    manual_only_reason: null
    app: salesforce
    action: Open the Account Ticker sample record and click its indicator.
    target: "Account Ticker indicator, Action Target with {!TickerSymbol} token"
    wait_for: Browser navigates to the resolved URL
    expect: >
      Navigates to the Yahoo Finance URL with the record's actual ticker symbol
      substituted in.
    shot: false
    fixture: dev-dataset
    narration: null
    narration_spoken: null
    conditional: false
    note: >
      The Account Ticker indicator itself comes from the sample_AccountContact
      config (deployed by the same config_demo/dev_org flow that loads the
      dev-dataset fixture, not a separate mechanism) — confirm whichever
      Account it's assigned to (the fixed "Salesforce" record or a generated
      one) actually has TickerSymbol populated before relying on this as a
      diffable/functional check; that population isn't guaranteed today.


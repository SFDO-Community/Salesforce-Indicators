area: priority-order
area_title: "Extension priority order flip"
area_risk: high
area_summary: >
  When two or more extensions on the same item are active at once, the tie-break
  logic that decides which one "wins" changed direction: the extension with the
  lowest Priority number now wins (ascending), where previously the highest
  Priority number won. This is a standalone behavior change, not specific to date
  extensions — it affects any multi-extension item regardless of match type, and
  it's exercised from two different UI surfaces (the record page itself, and the
  Key/legend modal's rule ordering — see key-legend-modal.yaml).
area_setup: >
  Use an item with two or more active Indicator_Item_Extension__mdt records
  (any match type — string, numeric, or date) with different Priority__c values.
paths:
  - force-app/main/default/objects/Indicator_Item_Extension__mdt
  - force-app/main/default/classes/Cmdt.cls
  - force-app/main/default/classes/IndicatorController.cls


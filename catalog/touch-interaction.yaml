area: touch-interaction
area_title: "Touch interaction & false-or-blank actions"
area_risk: high
area_summary: >
  On touch devices, tapping an indicator only opens its popover — it never fires
  the click action directly. The action fires only from the popover's own
  button. A new setting also controls whether the action is available while the
  indicator is showing its false/blank state.
paths:
  - force-app/main/default/lwc/indicatorBundleItem
  - force-app/main/default/lwc/indicatorBundle
  - force-app/main/default/objects/Indicator_Bundle_Item__mdt

scenarios:
  - slug: touch-tap-hover-only-indicator
    added: 2026-08-10
    added_reason: "original sprint regression plan (feature/staging-claude vs main)"
    added_ref: null
    status: active
    superseded_by: null
    risk: high
    automation: functional-only
    manual_only_reason: null
    app: salesforce
    action: >
      On a touch device (or Playwright touch emulation), tap an indicator that
      has only Hover Text (no action).
    target: Indicator with Hover Text only, no click action
    wait_for: Popover opens on first tap, closes on second tap
    expect: Popover opens; tapping again closes it.
    shot: false
    fixture: dev-dataset
    narration: null
    narration_spoken: null
    conditional: false
    note: null

  - slug: touch-tap-indicator-with-action-opens-popover-only
    added: 2026-08-10
    added_reason: "original sprint regression plan (feature/staging-claude vs main)"
    added_ref: null
    status: active
    superseded_by: null
    risk: high
    automation: functional-only
    manual_only_reason: null
    app: salesforce
    action: Tap an indicator that has a click action configured.

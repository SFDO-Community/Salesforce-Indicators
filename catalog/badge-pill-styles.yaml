area: badge-pill-styles
area_title: "Badge & Pill indicator styles"
area_risk: medium
area_summary: >
  New Badge and Pill render styles, selectable per-bundle, default to Avatar so
  existing pages should look untouched until an admin opts in.
paths:
  - force-app/main/default/lwc/indicatorBundleBadge
  - force-app/main/default/lwc/indicatorBundlePill
  - force-app/main/default/lwc/indicatorBundle

scenarios:
  - slug: badge-pill-default-avatar-unchanged
    added: 2026-08-10
    added_reason: "original sprint regression plan (feature/staging-claude vs main)"
    added_ref: null
    status: active
    superseded_by: null
    risk: medium
    automation: diffable
    manual_only_reason: null
    app: salesforce
    action: >
      Confirm a bundle with indsStyle left at its default renders exactly as it
      does on main (Avatar).
    target: Bundle with indsStyle unset
    wait_for: Bundle renders in Avatar style
    expect: Zero visual difference for unconfigured bundles.
    shot: true
    fixture: dev-dataset
    narration: null
    narration_spoken: null
    conditional: false
    note: null


    added: 2026-08-10
    added_reason: "original sprint regression plan (feature/staging-claude vs main)"
    added_ref: null
    status: active
    superseded_by: null
    risk: medium
    automation: functional-only
    manual_only_reason: null
    app: salesforce
    action: >
      On a Bundle Item, set Action Type = URL and leave Action Target blank,
      then save.
    target: Indicator_Bundle_Item__mdt with Action Type = URL, Action Target blank
    wait_for: Validation error message is shown
    expect: >
      Validation error, and the message specifically tells you to clear Action
      Type (not Action Target) to disable the action.

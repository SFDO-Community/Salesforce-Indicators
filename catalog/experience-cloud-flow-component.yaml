    action: >
      Add the Indicators component to an Experience Cloud record-detail page
      (implicit recordId).
    target: Indicators component on a published Experience Cloud site, guest user
    wait_for: Component renders on the published site
    expect: >
      Renders correctly for a guest/community user, respecting that user's
      field-level security.

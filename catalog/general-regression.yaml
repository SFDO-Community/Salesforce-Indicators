area: general-regression
area_title: "General regression pass"
area_risk: medium
area_summary: >
  IndicatorController.cls and Cmdt.cls were refactored on the path every bundle
  load goes through, including the "Unbundled Items" (-1) view — so ordinary,
  untouched configs deserve a pass too, not just the new features.
paths:
  - force-app/main/default/classes/Cmdt.cls
  - force-app/main/default/classes/IndicatorController.cls
  - force-app/main/default/lwc/indicatorBundle

scenarios:

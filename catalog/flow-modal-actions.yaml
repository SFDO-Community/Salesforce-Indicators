area: flow-modal-actions
area_title: "Flow Modal click actions"
area_risk: medium
area_summary: >
  A Bundle Item can now open a Screen Flow in a modal on click, in addition to
  URL navigation, with pause/resume and a record refresh on finish.
area_setup: >
  On an Indicator_Bundle_Item__mdt: Action Type = Flow Modal, Action Target = a
  Screen Flow API name. Test once with Action Confirm Required unchecked, once
  checked.
paths:
  - force-app/main/default/lwc/flowModal
  - force-app/main/default/objects/Indicator_Bundle_Item__mdt

scenarios:
  - slug: flow-modal-launches-without-confirm
    added: 2026-08-10
    added_reason: "original sprint regression plan (feature/staging-claude vs main)"
    added_ref: null
    status: active
    superseded_by: null
    risk: medium
    automation: diffable
    manual_only_reason: null
    app: salesforce
    action: Click the indicator directly with Confirm Required unchecked.
    target: Indicator with Action Type = Flow Modal, Confirm Required unchecked
    wait_for: Flow modal is visible
    expect: Flow modal launches immediately.
    shot: true
    fixture: dev-dataset
    narration: null
    narration_spoken: null
    conditional: false
    note: null


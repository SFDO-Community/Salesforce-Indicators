minimum_cumulusci_version: '3.68.1'
project:
    name: Salesforce-Indicators
    package:
        name: Salesforce-Indicators
        namespace: inds
        api_version: '67.0'
    git:
        default_branch: 'main'
    test:
        name_match: '%Tests'
    source_format: sfdx

orgs:
    scratch:
        dev:
            config_file: orgs/dev.json
            days: 30
            namespaced: false
        demo:
            config_file: orgs/demo.json
            days: 15
            namespaced: false
        regression:
            config_file: orgs/regression.json
            days: 5
            namespaced: false

tasks:
    robot:
        options:
            suites: robot/Salesforce-Indicators/tests
            options:
                outputdir: robot/Salesforce-Indicators/results

    robot_testdoc:
        options:
            path: robot/Salesforce-Indicators/tests
            output: robot/Salesforce-Indicators/doc/Salesforce-Indicators_tests.html

    run_tests:
        options:
            required_org_code_coverage_percent: 75

    deploy_sample_indicators:
        description: Deploys - Sample Indicators
        name: Deploy Sample Indicators
        group: Salesforce Metadata
        class_path: cumulusci.tasks.salesforce.Deploy
        options:
            path: unpackaged/config/sample_AccountContact/Part_1
    
    deploy_sample_indicators_layouts:
        description: Deploys - Sample Indicators Layouts
        name: Deploy Page Layouts for Sample Indicators
        group: Salesforce Metadata
        class_path: cumulusci.tasks.salesforce.Deploy
        options:
            path: unpackaged/config/sample_AccountContact/Part_2
    
    deploy_sample_indicators_objects:
        description: Deploys - Sample Indicators Assigning Layouts to Objects
        name: Deploy Page Layouts for Sample Indicators
        group: Salesforce Metadata
        class_path: cumulusci.tasks.salesforce.Deploy
        options:
            path: unpackaged/config/sample_AccountContact/Part_3
    
    deploy_training_indicators:
        description: Deploys - Example Indicators used for Training 
        name: Deploy Training Indicators
        group: Salesforce Metadata
        class_path: cumulusci.tasks.salesforce.Deploy
        options:
            path: unpackaged/config/training_Indicators

    generate_leads:
        description: Snowfakery - Generate Leads
        class_path: cumulusci.tasks.bulkdata.snowfakery.Snowfakery 
        options: 
            recipe: recipes/recipe.Leads.yml
            run_until_records_loaded: Lead:100
    
    generate_accounts_and_contacts:
        description: Snowfakery - Generate Accounts and Contacts
        class_path: cumulusci.tasks.bulkdata.snowfakery.Snowfakery
        options:
            recipe: recipes/recipe.AccountsWithContacts.yml
            run_until_records_loaded: Account:100
    
    set_user_preference:
        description: Create or update a UserPreference through the Salesforce REST API
        class_path: tasks.user_preference.SetUserPreference
        group: regression

    tokenize_cmdt_namespace:
        description: Namespace-tokenize CMDT record files freshly retrieved from a non-namespaced org (adds %%%NAMESPACE%%% to <field> content and ___NAMESPACE___ to filenames, in place, idempotently).
        class_path: tasks.tokenize_cmdt_namespace.TokenizeCmdtNamespace

flows:
  sample_inds:
    steps:
      1:
        task: deploy_sample_indicators
        ui_options:
          is_required: False
          is_recommended: False
      2:
        task: deploy_sample_indicators_layouts
        ui_options:
          is_required: False
          is_recommended: False
  
  customer_org:
    steps:
      1:
        task: install_managed
        options:
          security_type: NONE
      2:
        flow: sample_inds
      3:
        task: deploy_training_indicators
        ui_options:
          is_required: False
          is_recommended: False
  
  config_dev:
    steps:
      3:
        task: assign_permission_sets
        options:
          api_names: Indicators_Setup_Access
      4:
        task: generate_accounts_and_contacts
      5:
        flow: sample_inds
      6:
        task: deploy_sample_indicators_objects
  
  config_demo:
    steps:
      1:
        flow: install_prod
      2:
        task: assign_permission_sets
        options:
          api_names: Indicators_Setup_Access
      3:
        task: generate_accounts_and_contacts
      4:
        flow: sample_inds
      5:
        task: deploy_sample_indicators_objects
      6:
        task: deploy_training_indicators

  # Regression test data SHOULD deploy because of the same name dataset when using `regression` org
  config_regression:
    group: regression
    steps:
      1:
        task: assign_permission_sets
        options:
          api_names: Indicators_Setup_Access
      2:
        task: deploy
        description: Deploys - Regression Test Metadata Records
        options:
            path: regression/customMetadata
      3:
        task: deploy
        description: Deploys - Regression Test Themes
        options:
            path: regression/branding-themes

  regression_prod:
    group: regression
    steps:
      1:
        flow: install_prod
      2:
        flow: config_regression
      3:
        task: deploy
        description: Deploys - Regression Test Layouts
        options:
            path: regression/flexipages
            namespace_inject: inds
      4:
        task: deploy
        description: Deploys - Regression Test Objects
        options:
            path: regression/objects
      5:
        task: deploy
        description: Deploys - Regression v0.4-only
        options:
            path: regression/prod_only
  
  regression_prod_slds1:
    group: regression
    steps:
      1:
        flow: regression_prod
      2:
        task: deploy
        options:
            path: regression/settings-slds1

  regression_prod_light:
    group: regression
    steps:
      1:
        flow: regression_prod
      2:
        task: deploy
        options:
            path: regression/settings-slds2
      3:
        task: set_user_preference
        options:
            preference: "Color Scheme"  # or '113' from https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_userpreference.htm
            value: "LIGHT" # Trial and error showed options are: DARK, LIGHT, SYSTEM

  regression_prod_dark:
    group: regression
    steps:
      1:
        flow: regression_prod
      2:
        task: deploy
        options:
            path: regression/settings-slds2
      3:
        task: set_user_preference
        options:
            preference: "Color Scheme"  # or '113' from https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_userpreference.htm
            value: "DARK" # Trial and error showed options are: DARK, LIGHT, SYSTEM
  
  regression_dev:
    group: regression
    steps:
      1:
        flow: deploy_unmanaged
      2:
        task: deploy
        description: Deploys - Regression dev-only (feature CMDT, Test_Date__c, display flow)
        options:
            path: regression/dev_only
      3:
        task: update_admin_profile
      4:
        flow: config_regression
      5:
        task: deploy
        description: Deploys - Regression Test Layouts
        options:
            path: regression/flexipages
            namespace_inject: false
      6:
        task: deploy
        description: Deploys - Regression Test Objects
        options:
            path: regression/objects
      7:
        task: load_sample_data
      8:
        task: load_dataset
        description: Loads - Regression dev-only feature records (FEAT-01..03)
        options:
            mapping: datasets/features/features.mapping.yml
            sql_path: datasets/features/features.dataset.sql
      9:
        task: snapshot_changes

  regression_dev_slds1:
    group: regression
    steps:
      1:
        flow: regression_dev
      2:
        task: deploy
        options:
            path: regression/settings-slds1
  
  regression_dev_light:
    group: regression
    steps:
      1:
        flow: regression_dev
      2:
        task: deploy
        options:
            path: regression/settings-slds2
      3:
        task: set_user_preference
        options:
            preference: "Color Scheme"  # or '113' from https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_userpreference.htm
            value: "LIGHT" # Trial and error showed options are: DARK, LIGHT, SYSTEM
  
  regression_dev_dark:
    group: regression
    steps:
      1:
        flow: regression_dev
      2:
        task: deploy
        options:
            path: regression/settings-slds2
      3:
        task: set_user_preference
        options:
            preference: "Color Scheme"  # or '113' from https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_userpreference.htm
            value: "DARK" # Trial and error showed options are: DARK, LIGHT, SYSTEM

plans:
  install:
    slug: install
    title: Install Salesforce Indicators
    tier: primary
    is_listed: True
    preflight_message: "This will install Salesforce Indicators into your org."
    post_install_message: "Thanks for installing Salesforce Indicators. Please review the team’s Wiki page for next steps."
    error_message: ""
    steps:
      1:
        flow: customer_org
